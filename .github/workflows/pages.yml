name: Refresh scores & deploy

on:
  push:
    branches: ["claude/sweet-mendel-9qsu13"]
  schedule:
    - cron: "*/5 * * * *"     # auto-pull live scores every 5 minutes
  workflow_dispatch:

permissions:
  contents: write            # needed to commit refreshed scores back to the branch
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch live World Cup scores (ESPN, no key)
        continue-on-error: true     # a transient ESPN hiccup must never block the deploy
        run: node scripts/fetch-scores.mjs

      # GitHub Pages serves the committed branch contents, so commit the freshly
      # fetched data/live.json back. The site (and everyone's standings) then
      # updates on each refresh with no manual steps.
      - name: Commit refreshed scores to the branch
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/news.json
          if git diff --cached --quiet; then
            echo "No score/news changes to commit."
          else
            # bump the asset cache-bust version so browsers pick up fresh code+data
            sed -i -E "s/\?v=[0-9a-z]+/?v=$(date +%s)/g" index.html
            git add index.html
            git commit -m "data: refresh live scores & news [skip ci]"
            git pull --rebase origin claude/sweet-mendel-9qsu13 || true
            git push origin HEAD:claude/sweet-mendel-9qsu13
          fi

      # Also publish via the Actions artifact, so this keeps working if Pages
      # is switched to the "GitHub Actions" source.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site (with fresh data/live.json)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
