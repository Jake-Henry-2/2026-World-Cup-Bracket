name: Probe score feed
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check ESPN World Cup scoreboard
        run: |
          set +e
          for D in 20260613 20260614 20260615; do
            echo "==================== dates=$D ===================="
            curl -s -w "HTTP %{http_code}\n" \
              "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=$D" -o "e_$D.json"
            echo "bytes: $(wc -c < e_$D.json)"
            node -e '
              const fs=require("fs"); let d;
              try{ d=JSON.parse(fs.readFileSync("e_'"$D"'.json","utf8")); }catch(e){ console.log("parse fail:",e.message); process.exit(0); }
              console.log("league:", (d.leagues||[]).map(l=>l.slug||l.name).join(","));
              const ev=d.events||[];
              console.log("events:", ev.length);
              for(const e of ev){
                const c=(e.competitions||[])[0]||{}; const t=c.competitors||[];
                const note=(c.notes||[]).map(n=>n.headline).join(";");
                const g=t[0]||{}, a=t[1]||{};
                console.log("  ["+(e.status&&e.status.type&&e.status.type.state)+"]",
                  (g.team&&g.team.displayName), (g.score), "-", (a.score), (a.team&&a.team.displayName),
                  "| note:", note, "| grp:", (e.groups&&e.groups.abbreviation)||"");
              }
            '
          done
          echo "==================== RAW first event (20260614) ===================="
          node -e 'const d=JSON.parse(require("fs").readFileSync("e_20260614.json","utf8")); const e=(d.events||[])[0]; console.log(JSON.stringify(e,null,1).slice(0,2600));' 2>&1 | head -120
