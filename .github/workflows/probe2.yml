name: Probe ESPN summary
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect summary + range
        run: |
          set +e
          echo "==== date RANGE param (one call for many days)? ===="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=20260611-20260620" -o r.json -w "HTTP %{http_code}\n"
          node -e 'const d=JSON.parse(require("fs").readFileSync("r.json","utf8"));console.log("range events:",(d.events||[]).length, "| first id:", (d.events||[])[0]&&(d.events||[])[0].id)'
          EID=$(node -e 'const d=JSON.parse(require("fs").readFileSync("r.json","utf8"));const f=(d.events||[]).find(e=>e.status&&e.status.type&&e.status.type.state==="post")||(d.events||[])[0];console.log(f?f.id:"")')
          echo "sample finished event id: $EID"
          echo "==== SUMMARY shape for event $EID ===="
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/summary?event=$EID" -o s.json -w "HTTP %{http_code}\n"
          echo "bytes: $(wc -c < s.json)"
          node -e '
            const d=JSON.parse(require("fs").readFileSync("s.json","utf8"));
            console.log("top keys:", Object.keys(d).join(","));
            console.log("keyEvents:", (d.keyEvents||[]).length, "| commentary:", (d.commentary||[]).length);
            const ke=(d.keyEvents||[]).slice(0,4).map(e=>({t:e.type&&e.type.text, clock:e.clock&&e.clock.displayValue, txt:(e.text||"").slice(0,60)}));
            console.log("sample events:", JSON.stringify(ke,null,1));
            const bs=d.boxscore||{}; const teams=bs.teams||[];
            console.log("boxscore teams:", teams.length);
            if(teams[0]) console.log("team0 stat names:", (teams[0].statistics||[]).map(s=>s.name||s.label).slice(0,14).join(","));
            console.log("rosters:", (d.rosters||[]).length, "| gameInfo.venue:", d.gameInfo&&d.gameInfo.venue&&d.gameInfo.venue.fullName);
          ' 2>&1 | head -50
